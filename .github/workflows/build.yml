name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: fabric-1.20.1
            java: '17'
            gradle: '8.8'
          - project: fabric-1.21.1
            java: '21'
            gradle: '9.9.1'
          - project: fabric-1.21.11
            java: '25'
            gradle: '9.9.1'
          - project: fabric-1.21.5
            java: '21'
            gradle: '9.9.1'
          - project: fabric-1.21.8
            java: '21'
            gradle: '9.9.1'
          - project: fabric-1.20.4
            java: '17'
            gradle: '8.8'
          - project: fabric-1.20.6
            java: '21'
            gradle: '8.8'
          - project: fabric-26.1.2
            java: '25'
            gradle: '9.9.1'
          - project: fabric-26.2
            java: '25'
            gradle: '9.9.1'
          - project: fabric-26.3
            java: '25'
            gradle: '9.9.1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Gradle ${{ matrix.gradle }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Build ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: gradle build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}
          path: ${{ matrix.project }}/build/libs/*.jar
          if-no-files-found: error
